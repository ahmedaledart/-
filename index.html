<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المنصة العالمية للاسعار - التسجيل</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <div class="brand auth-brand">
          <img src="assets/ltn-logo.svg" alt="شعار شبكة ليبيا للتجارة" class="brand-logo" />
          <div>
            <span class="brand-title">المنصة العالمية للاسعار</span>
            <small>GLOBAL PRICES PLATFORM</small>
          </div>
        </div>

        <h1>مرحبًا بك</h1>
        <p class="auth-subtitle">سجل الدخول للمنصة عبر البريد الإلكتروني أو حساباتك السريعة.</p>

        <form class="auth-form" action="#" method="post">
          <label for="email">البريد الإلكتروني</label>
          <input id="email" type="email" placeholder="name@example.com" />
          <button type="submit" class="primary full">تسجيل بالبريد الإلكتروني</button>
        </form>

        <div class="auth-divider"><span>أو</span></div>

        <div class="social-buttons">
          <button class="ghost social google" type="button">التسجيل عبر Google</button>
          <button class="ghost social apple" type="button">التسجيل عبر Apple ID</button>
        </div>

        <a href="dashboard.html" class="dashboard-link">الانتقال إلى لوحة التحكم (رابط مفصول)</a>
      </section>
    </main>
  </body>
</html>
